<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">AADS 4.2 · Automotive AI Security Platform</title>
<desc id="desc">Animated abstract cybernetic banner with fluid spectral ribbons, a luminous glass sphere, geometric signal lines, and the AADS 4.2 title.</desc>
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100b24"/><stop offset=".48" stop-color="#11182e"/><stop offset="1" stop-color="#071e28"/></linearGradient>
  <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2=".25">
    <stop stop-color="#ff6b6b"><animate attributeName="stop-color" values="#ff6b6b;#ffbd69;#b8ff6a;#56e0ff;#b18cff;#ff6b6b" dur="12s" repeatCount="indefinite"/></stop>
    <stop offset=".48" stop-color="#b18cff"><animate attributeName="stop-color" values="#b18cff;#56e0ff;#ff6b6b;#ffbd69;#b8ff6a;#b18cff" dur="12s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#56e0ff"><animate attributeName="stop-color" values="#56e0ff;#b8ff6a;#b18cff;#ff6b6b;#ffbd69;#56e0ff" dur="12s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="orb" cx=".28" cy=".22" r=".85"><stop stop-color="#fff6d5" stop-opacity=".95"/><stop offset=".2" stop-color="#ffbd69" stop-opacity=".88"/><stop offset=".48" stop-color="#ff6b6b" stop-opacity=".72"/><stop offset=".72" stop-color="#b18cff" stop-opacity=".58"/><stop offset="1" stop-color="#56e0ff" stop-opacity=".1"/></radialGradient>
  <radialGradient id="mist"><stop stop-color="#b18cff" stop-opacity=".32"/><stop offset="1" stop-color="#56e0ff" stop-opacity="0"/></radialGradient>
  <pattern id="mesh" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#b4d6ff" stroke-opacity=".08"/></pattern>
  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
<rect width="1200" height="340" rx="28" fill="url(#base)"/>
<rect width="1200" height="340" rx="28" fill="url(#mesh)"/>
<ellipse cx="950" cy="175" rx="300" ry="210" fill="url(#mist)"/>
<ellipse cx="850" cy="55" rx="240" ry="70" fill="#ff6b6b" opacity=".12" filter="url(#blur)"><animate attributeName="cx" values="850;1000;850" dur="14s" repeatCount="indefinite"/></ellipse>
<g fill="none" stroke="url(#spectrum)" stroke-linecap="round" filter="url(#softGlow)">
  <path d="M-50 250 C120 90 230 310 390 175 S670 65 810 180 S1040 290 1250 70" stroke-width="5" opacity=".75"><animate attributeName="d" dur="11s" repeatCount="indefinite" values="M-50 250 C120 90 230 310 390 175 S670 65 810 180 S1040 290 1250 70;M-50 190 C130 320 240 60 410 205 S660 300 830 115 S1070 90 1250 220;M-50 250 C120 90 230 310 390 175 S670 65 810 180 S1040 290 1250 70"/></path>
  <path d="M-40 280 C180 160 245 350 455 225 S720 110 900 220 S1080 250 1240 130" stroke-width="1.5" opacity=".6"><animate attributeName="d" dur="8s" repeatCount="indefinite" values="M-40 280 C180 160 245 350 455 225 S720 110 900 220 S1080 250 1240 130;M-40 220 C180 330 280 120 460 245 S720 60 900 190 S1090 330 1240 90;M-40 280 C180 160 245 350 455 225 S720 110 900 220 S1080 250 1240 130"/></path>
</g>
<g transform="translate(1000 164)">
  <circle r="91" fill="url(#orb)" opacity=".88" filter="url(#softGlow)"><animate attributeName="r" values="87;94;87" dur="5s" repeatCount="indefinite"/></circle>
  <circle r="91" fill="none" stroke="#fff4e8" stroke-opacity=".7" stroke-width="1.2"/>
  <ellipse rx="125" ry="42" fill="none" stroke="url(#spectrum)" stroke-width="2.5" transform="rotate(-28)"><animateTransform attributeName="transform" type="rotate" from="-28" to="332" dur="24s" repeatCount="indefinite"/></ellipse>
  <ellipse rx="112" ry="63" fill="none" stroke="#a9eaff" stroke-opacity=".65" stroke-width="1.2" transform="rotate(48)"><animateTransform attributeName="transform" type="rotate" from="48" to="-312" dur="30s" repeatCount="indefinite"/></ellipse>
  <path d="M-27 2 L-7 22 L31 -25" fill="none" stroke="#fffdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".96" filter="url(#softGlow)"/>
  <circle cx="-60" cy="-55" r="4" fill="#fff6d5"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle>
</g>
<g fill="url(#spectrum)">
  <circle cx="85" cy="76" r="3"><animate attributeName="opacity" values=".25;1;.25" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="385" cy="58" r="2.5"><animate attributeName="opacity" values="1;.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="760" cy="56" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="1125" cy="276" r="3"><animate attributeName="opacity" values="1;.25;1" dur="1.9s" repeatCount="indefinite"/></circle>
</g>
<g font-family="monospace" font-size="12" letter-spacing="3" fill="#d4d4ff">
  <text x="58" y="52">VEHICLE SIGNALS <tspan fill="#ffbd69">/</tspan> MACHINE INTELLIGENCE</text>
  <text x="60" y="300" fill="#a6abc9" font-size="11" letter-spacing="2">INGEST <tspan fill="#ffbd69">→</tspan> ENGINEER <tspan fill="#b18cff">→</tspan> DETECT <tspan fill="#56e0ff">→</tspan> EXPLAIN <tspan fill="#b8ff6a">→</tspan> MONITOR</text>
</g>
<text x="54" y="161" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="900" letter-spacing="-2" fill="#fffaf5">AADS <tspan fill="url(#spectrum)" filter="url(#softGlow)">4.2</tspan></text>
<text x="60" y="204" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#e7e7ff">AUTOMOTIVE AI SECURITY PLATFORM</text>
<rect x="60" y="226" width="370" height="3" rx="2" fill="url(#spectrum)"><animate attributeName="width" values="100;370;245;370" dur="5.5s" repeatCount="indefinite"/></rect>
</svg>